<!DOCTYPE html>
    <html lang="ar" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>لوحة ادارة المتجر</title>
            <link rel="stylesheet" href="style.css">
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700@display=swap" rel="stylesheet">

            <style>

                .admin-card {
                    background: #fff;
                    padding: 25px;
                    border-radius: 15px;
                    max-width: 500px;
                    margin: 30px auto;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                }
                .form-group {
                    margin-bottom: 15px;
                }
                .form-group label {
                    display: block;
                    margin-bottom: 5px;
                    font-weight: bold;
                }
                .form-group input, .form-group select {
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #ddd;
                    border-radius: 8px;
                    font-family: 'Cairo', sans-serif;
                }
                .checkbox-group {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }
                .checkbox-group input {
                    width: auto;
                }
                .submit-btn {
                    background: #ff758c;
                    color: white;
                    border: none;
                    padding: 12px;
                    width: 100%;
                    border-radius: 8px;
                    font-size: 1.1rem;
                    font-weight: bold;
                    cursor: pointer;
                }
                </style>
                </head>
            <body>
                <header class="main-header">
                    <h1>لوحة تحكم المنتجات</h1>
                    <p>اضافة وتعديل حالة منتجات المتجر</p>
                    </header>
                    <main class="container">
                        <div class="admin-card">
                            <h2 style="margin-bottom: 20px; text-align: center;">اضافة منتج جديد</h2>
                            <form id="add-product-form">
                                <div class="form-group">
                                    <label>اسم القطعة /المنتج</label>
                                    <input type="text" id="p-name" placeholder="مثال فستان صيفي" required>
                                    </div>

                                    <div class="form-group">
                                        <label>السعر (بالجنيه)</label>
                                        <input type="number" id="p-price" placeholder="350" required>
                                        </div>

                                        <div class="form-group">
                                            <label> القسم:</label>
                                            <select id="p-category" required>
                                                <option value="women">قسم النساء</option>
                                                <option value="kids">قسم الاطفال</option>
                                                </select>
                                                </div>

                                                <div class="form-group">
                                                    <label>رابط صورة المنتج (URL)</label>
                                                    <input type="file" id="p-image" accept="image/*" required>
                                                    </div>
                                                    <div class="form-group checkbox-group">
                                                        <input type="checkbox" id="p-instock" checked>
                                                        <label for="p-instock"> المنتج متوفر حاليا في المخزن</label>
                                                        </div>

                                                        <button type="submit" class="submit-btn">حفظ واضافة للمتجر</button>
                                                        </form>
                                                        </div>
                                                        </main>
                                                        <script type="module" src="app.js"></script>
                                                        </body>
                                                        </html>
